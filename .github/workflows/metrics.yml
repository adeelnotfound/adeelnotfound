name: Metrics

on:
  # Refresh once a day
  schedule: [{cron: "0 4 * * *"}]
  # Let you trigger it manually from the Actions tab
  workflow_dispatch:
  # Re-render whenever you push to main
  push: {branches: ["main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.svg

          # ── base card: replaces the old github-readme-stats "GitHub stats" card ──
          base: header, activity, community, repositories, metadata

          # ── top languages: replaces the old "top languages" donut ──
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_analysis_timeout: 15

          # ── achievements: closest self-hosted equivalent to the old trophy case ──
          plugin_achievements: yes
          plugin_achievements_display: compact

          # theme to roughly match the neon/dark look of the rest of the profile
          config_timezone: Asia/Karachi
