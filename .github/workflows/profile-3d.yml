# ─────────────────────────────────────────────────────────────────────────────
#  3D Contribution Globe  →  /profile-3d-contrib/*.svg on main
#  Renders your contribution calendar as an isometric 3D scene.
#  Destination in repo: .github/workflows/profile-3d.yml
# ─────────────────────────────────────────────────────────────────────────────
name: Generate 3D Contribution Calendar

on:
  schedule:
    # once a day at 18:00 UTC (23:00 in UTC+5)
    - cron: "0 18 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Render 3D contribution SVGs
        uses: yoshi389111/github-profile-3d-contrib@0.7.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          # Optional niceties:
          # SETTING_JSON: .github/profile-3d.json
          # MAX_REPOS: 100

      - name: Commit the generated scene
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .
          git commit -m "chore: regenerate 3d contribution calendar" || exit 0
          git push
