# ─────────────────────────────────────────────────────────────────────────────
#  Trophy Case  →  assets/trophy.svg on main
#  Renders GitHub stat trophies (commits, stars, followers, PRs, repos) as a
#  static SVG committed to the repo, instead of hot-linking the shared public
#  instance at github-profile-trophy.vercel.app — that endpoint is shared by
#  everyone using the default URL and gets rate-limited/paused under load
#  (the project's own docs say "please use in moderation" and list community
#  mirrors for exactly this reason). Self-hosting avoids that entirely, same
#  as the approach already used for metrics.svg and the snake animation.
#  Destination in repo: .github/workflows/trophy.yml
# ─────────────────────────────────────────────────────────────────────────────

name: Generate Trophy Case

on:
  schedule:
    - cron: "0 5 * * *"   # once a day
  workflow_dispatch:        # lets you run it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  trophy:
    runs-on: ubuntu-latest
    permissions:
  contents: write
  id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate trophy SVG
        uses: Erik-Donath/github-profile-trophy@feature/generate-svg
        with:
          username: adeelnotfound
          output_path: assets/trophy.svg
          token: ${{ secrets.TROPHY_TOKEN }}
          # This action's generator also accepts theme/column/margin flags —
          # check its README under "Usage" if you want to match the neon
          # palette more closely than the default theme.

      - name: Commit generated trophy SVG
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/trophy.svg
          git commit -m "chore: regenerate trophy case" || exit 0
          git push
