name: Metrics

on:
  # Refresh once a day
  schedule: [{cron: "0 4 * * *"}]
  # Let you trigger it manually from the Actions tab
  workflow_dispatch:
  # Re-render whenever you push to main
  push: {branches: ["main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.svg

          # ── base card: replaces the old github-readme-stats "GitHub stats" card ──
          base: header, activity, community, repositories, metadata

          # ── top languages: replaces the old "top languages" donut ──
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_analysis_timeout: 15

          # ── achievements: disabled — this plugin scrapes GitHub's achievements
          # page HTML, which changes periodically and breaks it ("Unexpected
          # error"). Re-enable by flipping to `yes` if it starts working again.
          plugin_achievements: no

          # ── dark/neon theme override — without this the card renders in
          # GitHub's default light theme (blue links, light-gray calendar),
          # which clashes with the rest of the profile. Recolors text, headers,
          # icons, links, and the contribution calendar to match the palette
          # used in capsule-render banners and the typing SVG above.
          extras_css: |
            svg{background-color:#0d1117 !important}
            svg,.field{color:#8891a0 !important}
            h1,h2,h3{color:#00f0ff !important}
            h1 svg,h2 svg,h3 svg,.field svg{fill:#7b2fff !important}
            a{color:#ff2e97 !important}
            footer{color:#4b5563 !important}
            :root{
              --color-calendar-graph-day-bg:#161b22;
              --color-calendar-graph-day-border:rgba(0,240,255,0.08);
              --color-calendar-graph-day-L1-bg:#0d3d40;
              --color-calendar-graph-day-L2-bg:#0f6b73;
              --color-calendar-graph-day-L3-bg:#00b4c4;
              --color-calendar-graph-day-L4-bg:#00f0ff;
            }

          # theme to roughly match the neon/dark look of the rest of the profile
          config_timezone: Asia/Karachi
